name: backend-tests

on:
  push:
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: step1
          POSTGRES_PASSWORD: step1
          POSTGRES_DB: step1_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U step1 -d step1_test"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://step1:step1@localhost:5432/step1_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: ruff
        run: ruff check . && ruff format --check .
      - name: pytest
        run: pytest
