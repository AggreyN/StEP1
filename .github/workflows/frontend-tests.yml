name: Frontend tests

# Lint, type check, build and both Playwright suites for frontend/, plus a
# dependency audit. Everything runs against the in-browser mock API and a
# stand-in for Cognito, so no backend, AWS account or secrets are needed.

on:
  push:
    branches: [main, frontend]
    paths:
      - "frontend/**"
      - "amplify.yml"
      - ".github/workflows/frontend-tests.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "amplify.yml"
      - ".github/workflows/frontend-tests.yml"

permissions:
  contents: read

concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE: mock
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Audit dependencies (fails on high or critical)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Deploy settings are checked (and refuse the mock)
        run: |
          if npm run --silent check:deploy; then echo "check:deploy should refuse a build with no API"; exit 1; fi
          NEXT_PUBLIC_API_BASE=https://api.step1careers.com npm run --silent check:deploy

      - name: Build (static export)
        run: npm run build && test -f out/index.html && test -f out/404.html && test -f out/application.html

      # after the build, which writes the generated route types
      - name: Type check
        run: npm run typecheck

      - name: Colour contrast
        run: npm run contrast

      - name: amplify.yml headers match the definition
        run: npm run headers:amplify -- --check

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Tests (mock API, dev server)
        run: npm test

      - name: Tests (the exported site, served as files, three ways)
        run: npm run test:prod

      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
