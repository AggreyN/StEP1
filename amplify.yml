version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
    # BEGIN security headers (generated by frontend/scripts/amplify-headers.mjs; do not edit by hand)
    # connect-src uses launch defaults (any App Runner or AWS host). Pin it before launch.
    customHeaders:
      - pattern: '**/*'
        headers:
          - key: "Strict-Transport-Security"
            value: "max-age=31536000; includeSubDomains"
          - key: "X-Content-Type-Options"
            value: "nosniff"
          - key: "Referrer-Policy"
            value: "strict-origin-when-cross-origin"
          - key: "X-Frame-Options"
            value: "DENY"
          - key: "Permissions-Policy"
            value: "camera=(), microphone=(), geolocation=()"
          - key: "Content-Security-Policy"
            value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.awsapprunner.com https://*.amazonaws.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    # END security headers
