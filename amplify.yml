# AWS Amplify Hosting: build settings and response headers for the frontend.
#
# The site is a static export (plain files in frontend/out). In Amplify the
# app's platform must be WEB, not WEB_COMPUTE. See frontend/README.md,
# "Deploying to Amplify", for the environment variables, the rewrite rule
# (kept in the app's settings, not in this file) and how to check the result.
version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
            - npm run check:deploy
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: out
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
    # BEGIN security headers (generated by frontend/scripts/amplify-headers.mjs; do not edit by hand)
    customHeaders:
      - pattern: '**'
        headers:
          - key: "Strict-Transport-Security"
            value: "max-age=31536000; includeSubDomains"
          - key: "X-Content-Type-Options"
            value: "nosniff"
          - key: "Referrer-Policy"
            value: "strict-origin-when-cross-origin"
          - key: "X-Frame-Options"
            value: "DENY"
          - key: "Permissions-Policy"
            value: "camera=(), microphone=(), geolocation=()"
          - key: "Content-Security-Policy"
            value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    # END security headers
